[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "se-pretix-badgeapi"
dynamic = ["version"]
description = "pretix-Plugin: REST-Endpunkt zum Anlegen von Badge-Layouts (Schreibzugriff, den die pretix-API selbst nicht bietet)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "sE-pretix" }]
dependencies = []   # pretix bringt alles mit; Kompatibilität steht in PretixPluginMeta.compatibility

[project.entry-points."pretix.plugin"]
se_pretix_badgeapi = "se_pretix_badgeapi:PretixPluginMeta"

[tool.setuptools.dynamic]
version = { attr = "se_pretix_badgeapi.__version__" }

[tool.setuptools.packages.find]
include = ["se_pretix_badgeapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
